aid: archbee
name: Archbee
description: >-
  Archbee is a documentation and knowledge-portal platform for software teams. It creates, manages
  and publishes technical documentation, API references and internal wikis, with collaborative
  editing, revision history, branching and review, custom-domain publishing, an embeddable in-product
  docs widget, and AI-assisted search, writing and translation. Archbee imports and syncs OpenAPI and
  Postman collections to generate rendered API reference documentation. Its own developer surface is a
  24-operation REST Public API at https://api.archbee.com/api/public-api, a first-party CLI
  (@archbee/cli), a React widget package (@archbee/app-widget), and a Model Context Protocol server
  shipped in two deployments — a hosted OAuth endpoint at
  https://api.archbee.com/api/public-mcp-ds/sse and a local stdio server on npm as @archbee/mcp —
  exposing 26 tools over documents, spaces, templates, snippets and variables.
