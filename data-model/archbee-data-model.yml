- from: Document
  to: Document
  type: has_many
  via: parentDocId
  label: nested children
- from: Document
  to: Document
  type: belongs_to
  via: parentDocId
  label: parent
- from: Document
  to: Suggestion
  type: has_many
  via: docId
- from: DocTree
  to: Document
  type: has_many
  label: generated API reference pages
- from: Category
  to: Document
  type: has_many
  via: parentDocId
cascades:
- operation: deleteSpace
  deletes: [Document, File, DocTree, Category]
  invalidates: [space API key]
  reversible: false
- operation: deleteDocument
  deletes: [Document, File, Suggestion]
  condition: recursive true also deletes every nested child Document
  reversible: false
- operation: deleteSpaceGroup
  deletes: []
  condition: refused unless the group is empty
- operation: deleteVariable
  breaks: '{{name}} references in every document that embeds them'
  reversible: false
