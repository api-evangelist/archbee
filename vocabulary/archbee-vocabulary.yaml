vocabulary: 1.0.0
info:
  provider: Archbee
  description: Vocabulary for the Archbee Public API — spaces, space groups, documents, File Manager files,
    reader suggestions, organization export and generated API-reference trees. Regenerated 2026-09-04
    from openapi/archbee-public-api-openapi.yml; the previous version was built from a fabricated scaffold
    and named resources (pages, members) and operations (listSpaces, createPage, listMembers) that Archbee
    does not ship.
  created: '2026-04-19'
  modified: '2026-09-04'
  method: derived
  source: openapi/archbee-public-api-openapi.yml
operational:
  apis:
  - name: Archbee Public API
    namespace: archbee-public-api
    version: '2026-09-04'
    baseUrl: https://api.archbee.com/api/public-api
    status: active
  - name: Archbee MCP Server
    namespace: archbee-mcp
    version: 2.3.1
    baseUrl: https://api.archbee.com/api/public-mcp-ds/sse
    status: active
  resources:
  - name: api-reference
    description: Generated API-reference trees synced from a customer OpenAPI file
    apis:
    - archbee-public-api
    actions:
    - infoOpenApiDocument
    - syncOpenApiDocument
  - name: access-control
    description: Magic-link access requests for gated portals
    apis:
    - archbee-public-api
    actions:
    - requestMagicLinkAccess
  - name: documents
    description: Documentation pages, their content, nesting and search
    apis:
    - archbee-public-api
    actions:
    - deleteDocument
    - getDocument
    - importContent
    - searchDocument
    - updateCreateDocument
  - name: files
    description: Uploaded assets in the space File Manager
    apis:
    - archbee-public-api
    actions:
    - deleteAFileManagerFile
    - listFileManagerFiles
    - moveAFileManagerFile
    - overwriteAFileManagerFile
    - uploadSingleFile
  - name: organization
    description: Organization-level export and conditional display rules
    apis:
    - archbee-public-api
    actions:
    - organizationDisplayRules
    - organizationExport
  - name: space-groups
    description: Groupings of documentation spaces inside an organization
    apis:
    - archbee-public-api
    actions:
    - createSpaceGroup
    - deleteSpaceGroup
  - name: spaces
    description: Documentation spaces — the container for documents and the scope of an API key
    apis:
    - archbee-public-api
    actions:
    - cloneSpace
    - createSpace
    - deleteSpace
    - publishSpace
    - updateSpace
  - name: suggestions
    description: Reader-submitted suggested changes awaiting merge or discard
    apis:
    - archbee-public-api
    actions:
    - discardSuggestionDocument
    - mergeSuggestionIntoMainDocument
  actions:
  - name: requestMagicLinkAccess
    httpMethod: POST
    pattern: write
    path: /access-control/request
    description: Request Magic Link Access
  - name: deleteDocument
    httpMethod: DELETE
    pattern: write
    path: /doc
    description: Delete document
  - name: getDocument
    httpMethod: GET
    pattern: read
    path: /doc
    description: Get document
  - name: updateCreateDocument
    httpMethod: POST
    pattern: write
    path: /doc
    description: Update / Create document
  - name: searchDocument
    httpMethod: POST
    pattern: write
    path: /docs/search
    description: Search document
  - name: deleteAFileManagerFile
    httpMethod: DELETE
    pattern: write
    path: /file-manager/file
    description: Delete a File Manager file
  - name: listFileManagerFiles
    httpMethod: GET
    pattern: read
    path: /file-manager/files
    description: List File Manager files
  - name: moveAFileManagerFile
    httpMethod: POST
    pattern: write
    path: /file-manager/move
    description: Move a File Manager file
  - name: overwriteAFileManagerFile
    httpMethod: POST
    pattern: write
    path: /file-manager/replace
    description: Overwrite a File Manager file
  - name: importContent
    httpMethod: POST
    pattern: write
    path: /import-content
    description: Import Content
  - name: infoOpenApiDocument
    httpMethod: GET
    pattern: read
    path: /info-api-reference
    description: Info Open Api document
  - name: createSpaceGroup
    httpMethod: POST
    pattern: write
    path: /space-group/create
    description: Create Space Group
  - name: deleteSpaceGroup
    httpMethod: DELETE
    pattern: write
    path: /space-group/delete
    description: Delete Space Group
  - name: cloneSpace
    httpMethod: POST
    pattern: write
    path: /space/clone
    description: Clone Space
  - name: createSpace
    httpMethod: POST
    pattern: write
    path: /space/create
    description: Create Space
  - name: deleteSpace
    httpMethod: DELETE
    pattern: write
    path: /space/delete
    description: Delete Space
  - name: publishSpace
    httpMethod: POST
    pattern: write
    path: /space/publish
    description: Publish Space
  - name: updateSpace
    httpMethod: POST
    pattern: write
    path: /space/update
    description: Update Space
  - name: discardSuggestionDocument
    httpMethod: POST
    pattern: write
    path: /suggest-change/discard
    description: Discard suggestion document
  - name: mergeSuggestionIntoMainDocument
    httpMethod: POST
    pattern: write
    path: /suggest-change/merge
    description: Merge suggestion into main document
  - name: syncOpenApiDocument
    httpMethod: POST
    pattern: write
    path: /sync-api-reference
    description: Sync Open Api document
  - name: organizationDisplayRules
    httpMethod: GET
    pattern: read
    path: /team/display-rules
    description: Organization Display Rules
  - name: organizationExport
    httpMethod: GET
    pattern: read
    path: /team/export
    description: Organization Export
  - name: uploadSingleFile
    httpMethod: POST
    pattern: write
    path: /upload/file
    description: Upload single file
identifiers:
  scheme: nanoid
  length: 21
  prefixed: false
  keys:
  - docId
  - docSpaceId
  - docSpaceGroupId
  - fileId
  - docTreeId
  - teamId
  - conditionalRuleId
  - searchSessionId
