  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no Sunset or Deprecation response headers, and no operation in the
    contract is marked deprecated. Searched the docs, the pricing FAQ and the terms of service on
    2026-09-04 and found no statement of notice period for a breaking change.
