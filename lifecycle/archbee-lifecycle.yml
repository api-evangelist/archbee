versioning:
  scheme: none
  in_url: false
  in_header: false
  note: >-
    The Public API carries no version segment, no version header and no version query parameter. The
    base is https://api.archbee.com/api/public-api and every operation sits directly under it. Archbee
    publishes no API version number, so a consumer has no way to pin behaviour or to detect that the
    contract moved. The specification file in this repo is stamped with the harvest date, not with a
    provider-published version.
deprecation:
