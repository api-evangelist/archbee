specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Archbee
providerId: archbee
generated: '2026-09-04'
method: searched
source: https://www.archbee.com/pricing
created: '2026-05-04'
modified: '2026-09-04'
note: >-
  Replaces the 2026-05-04 scaffold, which invented a free tier with a 1,000-request monthly quota.
  Archbee has no free tier — the pricing FAQ states plainly "A free offering is not available at the
  moment" — and publishes no per-plan API request quota at all. Everything below is transcribed from
  the published pricing page on 2026-09-04. Prices are the advertised "starting at" figures; Archbee
  also runs a pricing calculator that quotes on team size, so a real invoice can exceed these.
currency: USD
billing_periods:
- monthly
- annual
trial:
  days: 14
  credit_card_required: false
  free_tier: false
free_tier_note: '"A free offering is not available at the moment." — pricing FAQ, 2026-09-04.'
plan_count: 3
plans:
- id: archbee-growing
  name: Growing
  type: paid
  price: '80.00'
  currency: USD
  period: month
  price_qualifier: starting at
  description: For growing teams and basic documentation needs.
  entries:
  - label: Readers
    limit: unlimited
    note: Readers are never charged as seats.
  - label: Project spaces
    limit: unlimited
  - label: File storage
    limit: 10GB + 2GB per team member
  - label: Document revision history
    limit: 1 year
  - label: Custom domains
    limit: 1
  - label: AI add-on tokens
    limit: 20000000
    timeFrame: month
    overage_price: '1.20'
    overage_unit: per 1M tokens
  features:
  - Public and private portals
  - Custom domain and branding
  - Custom JavaScript
  - Password protection
  - GitHub integration
  - API documentation
- id: archbee-scaling
  name: Scaling
  type: paid
  price: '350.00'
  currency: USD
  period: month
  price_qualifier: starting at
  most_popular: true
  description: Advanced documentation needs for scaling companies.
  entries:
  - label: File storage
    limit: 20GB + 10GB per team member
  - label: Document revision history
    limit: 2 years
  - label: AI add-on tokens
    limit: 40000000
    timeFrame: month
    overage_price: '1.20'
    overage_unit: per 1M tokens
  features:
  - Everything in Growing
  - Complete branding control
  - Review system
  - Reusable content and variables
  - Versioning and localization
  - Advanced team and reader access control
  - Reusable variables (required for the MCP create_variable and create_content_snippet tools)
- id: archbee-enterprise
  name: Enterprise
  type: enterprise
  price: null
  price_model: contact-sales
  contact: sales@archbee.com
  description: Complete documentation solutions for large organizations and enterprises.
  entries:
  - label: File storage
    limit: 100GB + 10GB per team member
  - label: Document revision history
    limit: 5 years
  - label: Custom domains
    limit: per contract
  - label: AI add-on tokens
    limit: 100000000
    timeFrame: month
    overage_price: '1.20'
    overage_unit: per 1M tokens
  features:
  - Everything in Scaling
  - All add-ons included
  - Multiple teams and organizations
  - AI-assisted translations
  - SAML and OIDC SSO
  - Invoicing options
  - Onboarding and training
  - Priority support
add_ons:
- id: cloud-prem
  name: Cloud-Prem
  description: >-
    Archbee deploys into an AWS subaccount the customer owns and pays for, with a dedicated DevOps
    engineer. Enterprise plans only.
  price: '100000.00'
  currency: USD
  period: year
  price_qualifier: starting at
  minimum_term: 3 years
  contact: sales@archbee.com
  docs: https://www.archbee.com/docs/cloudprem
- id: ai
  name: AI add-on
  description: >-
    Token-metered AI features (Writer Agent, AI Write, AI Translations, question answering) served by
    OpenAI models on Microsoft Azure OpenAI. Soft and hard consumption limits are configurable.
  overage_price: '1.20'
  overage_unit: per 1M tokens
  note: >-
    Overage above 1.2B additional tokens in a billing cycle may be invoiced before the next regular
    billing cycle.
discounts:
- name: Open source
  detail: Free Growing plan for open source software.
- name: Non-profit and education
  detail: 50% discount.
- name: Startup program
  detail: 50% off any plan for 2 years, for early-stage companies.
refunds:
  policy: Full refund within the first paid month, no questions asked.
  source: https://www.archbee.com/pricing
api_metering:
  metered: false
  note: >-
    Archbee does not meter or price the Public API or the MCP server separately. API access is a
    feature of the subscription, and no plan publishes a request quota. The only usage-metered thing
    on the price list is AI tokens.
