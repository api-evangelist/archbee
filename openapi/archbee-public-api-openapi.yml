                  example: true
                  default: false
                openApiLanguageExamples:
                  type: string
                  description: OPTIONAL. Add your custom language examples. Maximum 5 programming language
                    examples are allowed!
                  example: '["python","r","javascript"]'
              required:
              - file
      responses:
        '200':
          description: Import OK status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - OK
                    description: Response Status
                    example: OK
                  data:
