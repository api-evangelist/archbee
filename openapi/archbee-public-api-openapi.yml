    post:
      operationId: syncOpenApiDocument
      summary: Sync Open Api document
      tags:
      - API Reference
      x-source-doc: https://www.archbee.com/docs/sync-open-api-document
      description: Sync Open Api document with a new or existing Open Api tree
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                docTreeId:
