                    new docTree is created and its id is returned
                  example: 21-character__string0
                  default: 21-character__string0
                file:
                  type: string
                  format: binary
                  description: Open api file, .json or .yml or .yaml or .zip
                  example: upload file
                  default: '@swagger.json'
                type:
                  type: string
                  enum:
                  - openapi
                  - postman
                  description: Type of import file. Default openapi
                  example: openapi
                  default: openapi
                openApiTryIt:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: OPTIONAL. You can now test your API's directly in the editor or on your
                    published docs with the new API Try It!
                  example: true
                  default: true
                openApiUseOwnBackend:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: OPTIONAL. When 'Try It' is enabled, send requests directly from the browser
                    to the URL defined in the OpenAPI spec instead of proxying through Archbee. Requires
                    CORS configured on your backend.
                  example: false
                  default: false
                showDownloadOpenApiFile:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: OPTIONAL. You can show/hide the download link of the imported Open API
                    file in the Open API tree.
                  example: true
                  default: false
                shouldCreateSchemaCategory:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: OPTIONAL. You can create models category to display all your models.
                  example: true
                  default: false
                shouldCreateIntro:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
